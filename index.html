<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arranchamento - 2ª Cia Fuz Mec</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>ARRANCHAMENTO</h1>
  <p>2ª Cia Fuz Mec</p>
</header>

<main>

  <section class="card">
    <h2>Militares</h2>

    <div id="lista"></div>

    <p id="vazio">Nenhum militar cadastrado.</p>
  </section>

  <section class="card">
    <h2>Área do Administrador</h2>

    <button id="entrar">Entrar como administrador</button>

    <div id="admin" class="hidden">

      <input
        id="nome"
        type="text"
        placeholder="Nome do militar"
      >

      <button id="adicionar">Adicionar nome</button>

      <button id="sair" class="secondary">Sair</button>

      <div id="adminLista"></div>

    </div>
  </section>

</main>

<div id="modal" class="modal hidden">

  <div class="modal-box">

    <h2>Login do Administrador</h2>

    <input
      id="senha"
      type="password"
      placeholder="Senha"
    >

    <button id="login">Entrar</button>

    <button id="fechar" class="secondary">
      Cancelar
    </button>

    <p id="erro"></p>

  </div>

</div>

<footer>
  Arranchamento • 2ª Cia Fuz Mec
</footer>

<script src="script.js"></script>

</body>
</html>
